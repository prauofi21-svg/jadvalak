name: Gateway watchdog

# Every 10 minutes: keep the gateway chain alive and healthy.
#   1) CANCEL wedged runs — a run still in_progress after ~6.6 h is a dead
#      runner (GitHub failed to enforce the job's own timeout-minutes; seen
#      live on 2026-10-11: the bot was frozen for 8 h while the watchdog
#      itself was starved by GitHub scheduling delays at */30).
#   2) If no gateway run is in progress/queued AND control.json is ON,
#      dispatch a fresh one (offset=-1 bootstrap). This heals broken chains
#      and GitHub hiccups.
#   3) Cross-repo rescue: if the Meta Guardian of the nasa-apod-bot repo
#      (the @daily_sciences channel pipelines) has been silent for > 2.5 h,
#      re-dispatch it there — see the last step. On 2026-10-19 GitHub's
#      cron scheduler silently dropped ALL of that repo's scheduled triggers
#      for 17+ hours while THIS repo's scheduler kept firing, so a watchdog
#      living here is a genuinely independent third engine for the channel.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  # actions: write is REQUIRED to dispatch/cancel gateway runs.
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Is the gateway alive (and not wedged)?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          NOW=$(date +%s)

          # 1) cancel wedged gateway runs (in_progress/queued far too long)
          WEDGED=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/gateway.yml/runs?per_page=30" \
            | python3 -c "
          import json, sys, datetime
          now = float('$NOW')
          runs = json.load(sys.stdin).get('workflow_runs', [])
          out = []
          for r in runs:
              if r['status'] in ('in_progress', 'queued'):
                  created = datetime.datetime.strptime(
                      r['created_at'], '%Y-%m-%dT%H:%M:%SZ'
                  ).replace(tzinfo=datetime.timezone.utc).timestamp()
                  # gateway polls ~5h45m; 6.6h means the runner is wedged
                  if now - created > 6.6 * 3600:
                      out.append(str(r['id']))
          print(' '.join(out))
          ")
          for RID in $WEDGED; do
            echo "cancelling wedged gateway run $RID"
            curl -s -o /dev/null -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$RID/cancel" || true
          done
          [ -n "$WEDGED" ] && sleep 8

          # 2) active check
          ACTIVE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/gateway.yml/runs?per_page=20" \
            | python3 -c "
          import json,sys
          runs=json.load(sys.stdin).get('workflow_runs',[])
          active=[r for r in runs if r['status'] in ('in_progress','queued')]
          print(len(active))
          ")
          echo "active gateway runs: $ACTIVE"
          if [ "$ACTIVE" != "0" ]; then
            echo "gateway is alive — nothing to do"
            exit 0
          fi

          ON=$(curl -s "https://raw.githubusercontent.com/$REPO/main/control.json" \
            | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            print('off' if str(d.get('gateway','on')).lower()=='off' else 'on')
          except Exception:
            print('on')
          ")
          echo "control state: $ON"
          if [ "$ON" = "off" ]; then
            echo "gateway disabled via control.json — not restarting"
            exit 0
          fi

          echo "gateway is DOWN — restarting it"
          HTTP=$(curl -s -o /tmp/dispatch_resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/gateway.yml/dispatches" \
            -d '{"ref":"main","inputs":{"offset":"-1"}}')
          echo "dispatch http $HTTP"
          cat /tmp/dispatch_resp.json || true
          [ "$HTTP" = "204" ] || exit 1

      - name: Puzzle-file guardian — never let a day open without its crosswords
        # 2026-10-24 post-mortem: all three Daily-puzzles cron slots failed
        # (generation bug) and GitHub's scheduler also silently DROPPED the
        # 03:30 UTC catch-up run — the mini app opened the day with no file
        # and replayed yesterday's 7 puzzles. This beat closes that hole:
        # every 10 minutes it checks the Tehran-today and Tehran-tomorrow day
        # files on main and dispatches the (idempotent) Daily-puzzles
        # workflow whenever one is missing or short. The generator never
        # touches a complete day, tops short days UP keeping the existing
        # puzzles, and the active-run check prevents dispatch pile-ups, so
        # an extra dispatch is always a safe no-op or a pure improvement.
        # Failure-tolerant by design: ALWAYS exits 0.
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          TODAY=$(TZ='Asia/Tehran' date +%F)
          TOMORROW=$(TZ='Asia/Tehran' date -d '+1 day' +%F)
          HOUR=$(TZ='Asia/Tehran' date +%H)

          count_puzzles () {  # $1 = date -> puzzle count (0 if missing/broken)
            curl -s "https://raw.githubusercontent.com/$REPO/main/data/$1.json" \
              | python3 -c "
          import json,sys
          try:
              print(len(json.load(sys.stdin).get('puzzles',[])))
          except Exception:
              print(0)
          "
          }
          N_TODAY=$(count_puzzles "$TODAY")
          N_TOMORROW=$(count_puzzles "$TOMORROW")
          echo "day files — today $TODAY: $N_TODAY/10, tomorrow $TOMORROW: $N_TOMORROW/10 (hour $HOUR Tehran)"

          NEED=0
          # today's file must exist and be complete at any hour — it was
          # created as "tomorrow" by the previous evening's run
          if [ "$N_TODAY" -lt 10 ]; then NEED=1; fi
          # tomorrow's file is only expected after the 23:00 Tehran main run
          if [ "$HOUR" -ge 23 ] && [ "$N_TOMORROW" -lt 10 ]; then NEED=1; fi
          if [ "$NEED" = "0" ]; then
            echo "all day files present and complete — nothing to do"
            exit 0
          fi

          # don't pile on: skip while a Daily-puzzles run is active/queued
          ACTIVE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/puzzles-daily.yml/runs?per_page=10" \
            | python3 -c "
          import json,sys
          try:
              runs=json.load(sys.stdin).get('workflow_runs',[])
              print(len([r for r in runs if r['status'] in ('in_progress','queued')]))
          except Exception:
              print(1)
          ")
          if [ "$ACTIVE" != "0" ]; then
            echo "a Daily-puzzles run is already in flight — letting it finish"
            exit 0
          fi

          echo "day file missing/short — dispatching Daily puzzles (idempotent)"
          HTTP=$(curl -s -o /tmp/pz_resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/puzzles-daily.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch http $HTTP $(cat /tmp/pz_resp.json 2>/dev/null || true)"
          exit 0

      - name: Cross-repo rescue — keep the channel pipelines' Meta Guardian alive
        # Engine 3 for @daily_sciences (prauofi21-svg/nasa-apod-bot): its
        # Meta Guardian has its own two engines (a */30 cron on the workflow
        # + a self-chaining workflow_dispatch loop). This step revives it if
        # BOTH of those die: it checks the last meta-guardian run over there
        # and re-dispatches it after > 2.5 h of silence (beats run ~every
        # 27 min, so 2.5 h means both engines are gone). Uses the
        # CROSS_DISPATCH_TOKEN PAT secret — delete that secret (or set
        # "crossrescue": "off" in control.json) to disable the rescue.
        # Failure-tolerant by design: this step ALWAYS exits 0 so it can
        # never break the watchdog's own gateway duties.
        env:
          CROSS_TOKEN: ${{ secrets.CROSS_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          if [ -z "$CROSS_TOKEN" ]; then
            echo "no CROSS_DISPATCH_TOKEN secret — cross-repo rescue disabled"
            exit 0
          fi

          XON=$(curl -s "https://raw.githubusercontent.com/$REPO/main/control.json" \
            | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
              print('off' if str(d.get('crossrescue','on')).lower()=='off' else 'on')
          except Exception:
              print('on')
          ")
          echo "cross-rescue control state: $XON"
          if [ "$XON" = "off" ]; then
            echo "cross-repo rescue disabled via control.json — not touching it"
            exit 0
          fi

          STATUS=$(curl -s -H "Authorization: Bearer $CROSS_TOKEN" \
            "https://api.github.com/repos/prauofi21-svg/nasa-apod-bot/actions/workflows/meta-guardian.yml/runs?per_page=5" \
            | python3 -c "
          import json, sys, datetime
          try:
              runs = json.load(sys.stdin).get('workflow_runs', [])
          except Exception:
              print('ERROR'); raise SystemExit
          if any(r['status'] in ('in_progress', 'queued') for r in runs):
              print('ACTIVE'); raise SystemExit
          if not runs:
              print('NONE'); raise SystemExit
          now = datetime.datetime.now(datetime.timezone.utc)
          c = datetime.datetime.strptime(runs[0]['created_at'], '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc)
          print(int((now - c).total_seconds() // 60))
          ") || echo ERROR
          echo "meta-guardian over there: ${STATUS:-ERROR} (minutes since last run / ACTIVE / NONE / ERROR)"

          case "$STATUS" in
            ACTIVE|ERROR|"") echo "alive or unknown — not touching it"; exit 0 ;;
            NONE) echo "meta-guardian has never run — dispatching the first beat" ;;
            *)
              if [ "$STATUS" -lt 150 ] 2>/dev/null; then
                echo "meta-guardian ran recently (${STATUS} min ago) — nothing to do"
                exit 0
              fi
              echo "meta-guardian silent for ${STATUS} min (> 150) — reviving it"
              ;;
          esac

          HTTP=$(curl -s -o /tmp/cross_resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CROSS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/prauofi21-svg/nasa-apod-bot/actions/workflows/meta-guardian.yml/dispatches" \
            -d '{"ref":"main","inputs":{"beat_minutes":"26"}}')
          echo "cross-repo rescue dispatch -> HTTP $HTTP $(cat /tmp/cross_resp.json 2>/dev/null || true)"
          exit 0
