name: Daily puzzles

# Generates the crossword day files with GitHub-hosted runners + Groq LLM.
#   23:00 Tehran (19:30 UTC)  — main evening run (tomorrow's file)
#   01:00 Tehran (21:30 UTC)  — backup evening run
#   07:00 Tehran (03:30 UTC)  — morning catch-up (heals any failed evening)
# The generator is idempotent: an existing day file (>= 6 puzzles) is NEVER
# overwritten, so extra runs can never change the day's puzzles mid-day.

on:
  schedule:
    - cron: "30 19 * * *"
    - cron: "30 21 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD Tehran date to generate (empty = today+tomorrow)"
        required: false
        default: ""
      force:
        description: "force regeneration even if the day file exists"
        type: boolean
        required: false
        default: false
      keep_first:
        description: "keep the first N puzzles of the existing day (content fix); 0 = full regen"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: daily-puzzles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate puzzles
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          DATE_ARG: ${{ inputs.date }}
          FORCE_ARG: ${{ inputs.force && '--force' || '' }}
          KEEP_ARG: ${{ inputs.keep_first || '0' }}
        run: |
          if [ -n "$DATE_ARG" ]; then
            python generate_puzzles.py --date "$DATE_ARG" $FORCE_ARG --keep-first "$KEEP_ARG"
          else
            python generate_puzzles.py --date auto $FORCE_ARG --keep-first "$KEEP_ARG"
          fi

      - name: Commit puzzle data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "data unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: daily crossword data [skip ci]"
          for i in 1 2 3; do
            if git push origin main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i) — rebasing, keeping OUR data files"
            git fetch origin main
            if git rebase origin/main; then
              continue
            fi
            # resolve any data/ conflict by keeping our freshly generated version
            git checkout --theirs -- data/ 2>/dev/null || true
            git add -A data/ 2>/dev/null || true
            git rebase --continue || true
          done
          git push origin main
