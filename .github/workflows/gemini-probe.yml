name: Gemini probe

# One-off diagnostic: list the model ids this GEMINI_API_KEY can actually use
# (OpenAI-compatible endpoint) and test tiny chat calls on candidates.
# Deleted from the repo right after the probe.

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=== models list (ids) ==="
          curl -s -m 60 -H "Authorization: Bearer $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/openai/models" \
            | python3 -c "import json,sys
          try:
              d=json.load(sys.stdin)
              ids=sorted(m.get('id','') for m in d.get('data',[]))
              print('\n'.join(ids))
          except Exception as e:
              print('PARSE ERROR', e)"
          echo
          echo "=== chat completion tests ==="
          for m in gemini-flash-latest models/gemini-flash-latest \
                   gemini-3.8-flash models/gemini-3.8-flash \
                   gemini-3.8-flash-lite gemini-flash-lite-latest \
                   gemini-2.5-flash-lite gemini-2.0-flash; do
            code=$(curl -s -m 45 -o /tmp/r.json -w '%{http_code}' \
              -H "Authorization: Bearer $GEMINI_API_KEY" -H "Content-Type: application/json" \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"say OK\"}],\"max_tokens\":8}" \
              "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions")
            body=$(head -c 260 /tmp/r.json | tr '\n' ' ')
            echo "TEST $m -> HTTP $code"
            echo "     $body"
          done
